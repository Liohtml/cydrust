name: Release

# Builds all four host binaries (vibe-bridge, serial_bridge, install_hooks,
# vibe_hook) for Linux/Windows/macOS and publishes ONE archive per platform to
# the GitHub Release for a pushed version tag. The firmware
# .bin image is attached separately by firmware-release.yml (same tag). This
# workflow owns the Release object and its notes (taken from the tag annotation).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Build one host bundle per platform ────────────────────────────────────
  build:
    name: Build bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The archive name carries rustc's host triple (see
        # scripts/package-release.sh), so it always states what was built —
        # macos-latest is Apple Silicon, not x86_64.
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install libudev-dev (Linux — required by serialport)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      # NB: `bridge` is a workspace member, so cargo builds into the
      # workspace-root `target/` (NOT `bridge/target/`).
      - name: Cache Cargo registry and build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      # All four: install_hooks and vibe_hook are what make the Waiting state
      # work, and install_hooks resolves vibe_hook as a sibling executable.
      - name: Build host binaries (release)
        run: cargo build --release -p vibe-bridge --bins

      - name: Stage bundle
        shell: bash
        run: scripts/package-release.sh "${{ github.ref_name }}" dist

      # Unix: package-release.sh already wrote the .tar.gz.
      - name: Zip bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = Get-ChildItem dist -Directory | Select-Object -First 1
          Compress-Archive -Path $stage.FullName -DestinationPath "dist/$($stage.Name).zip"

      - name: Smoke-test the bundle
        shell: bash
        run: |
          stage="$(find dist -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          ls -l "$stage"
          "$stage"/serial_bridge* --help
          "$stage"/install_hooks* --help

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: host-bundle-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  # ── Publish the GitHub Release (tag pushes only) ──────────────────────────
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract release notes from tag annotation
        id: notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # actions/checkout does not reliably preserve the *annotated* tag
          # object, so a bare `git tag --format='%(contents:body)'` can fall
          # back to the commit message. Re-fetch the tag object explicitly.
          git fetch --force --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}" 2>/dev/null || true
          NOTES=$(git for-each-ref "refs/tags/${TAG}" --format='%(contents:body)' 2>/dev/null || true)
          {
            echo "body<<EOF"
            echo "$NOTES"
            echo ""
            echo "---"
            echo "**Binaries** are attached below. See the [README](README.md) for"
            echo "installation instructions and [firmware/RELEASES.md](firmware/RELEASES.md)"
            echo "for flashing the firmware image."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2.0.8
        with:
          tag_name: ${{ github.ref_name }}
          name: "CYDRUST ${{ github.ref_name }}"
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
