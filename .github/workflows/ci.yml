name: CI

# Single entry point for pull-request and integration CI. A change-detection
# job scopes the expensive builds (bridge / firmware) to what actually changed,
# and a final "CI / all-green" gate always runs — so every PR, even a docs-only
# one, reports one consistent status that branch protection can require without
# deadlocking on path-filtered checks.

on:
  push:
    branches: [master, main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Detect which areas changed ────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      bridge: ${{ steps.filter.outputs.bridge }}
      firmware: ${{ steps.filter.outputs.firmware }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            bridge:
              - 'bridge/**'
              - '.github/workflows/ci.yml'
            firmware:
              - 'firmware/**'
              - '.github/workflows/ci.yml'

  # ── Bridge: tests (Linux + Windows) ───────────────────────────────────────
  bridge-test:
    name: Bridge · Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.bridge == 'true' || github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libudev-dev (Linux — required by serialport)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-
      - name: Run tests (all features)
        run: cargo test --all-features

  # ── Bridge: clippy + rustfmt ──────────────────────────────────────────────
  bridge-lint:
    name: Bridge · Clippy + fmt
    needs: changes
    if: needs.changes.outputs.bridge == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install libudev-dev (Linux — required by serialport)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ubuntu-latest-cargo-lint-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ubuntu-latest-cargo-lint-
            ubuntu-latest-cargo-
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ── Bridge: test coverage (non-blocking report) ───────────────────────────
  bridge-coverage:
    name: Bridge · Coverage
    needs: changes
    if: needs.changes.outputs.bridge == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install libudev-dev (Linux — required by serialport)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ubuntu-latest-cargo-cov-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ubuntu-latest-cargo-cov-
            ubuntu-latest-cargo-
      - name: Generate coverage (lcov)
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - name: Print coverage summary
        run: cargo llvm-cov report --summary-only
      - name: Upload to Codecov (tokenless, best-effort)
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
      - name: Upload lcov artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-coverage-lcov
          path: lcov.info

  # ── Firmware: ESP32 build matrix (blocking) ───────────────────────────────
  # Every shipped feature combination must compile. BLE is known-broken on the
  # current esp toolchain (see firmware/Cargo.toml) and runs as a separate
  # allow-failure job below so the breakage stays visible without blocking.
  firmware-build:
    name: Firmware · Build (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.firmware == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: usb
            flags: ""
          - name: wifi-ota
            flags: "--features wifi,ota"
            sdkconfig: "sdkconfig.defaults;sdkconfig.defaults.ota"
          - name: eink
            flags: "--features eink"
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install esp Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32
          ldproxy: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ubuntu-latest-cargo-firmware-${{ hashFiles('firmware/Cargo.lock') }}
          restore-keys: |
            ubuntu-latest-cargo-firmware-
            ubuntu-latest-cargo-
      - name: Build firmware (${{ matrix.name }})
        env:
          CARGO_TARGET_DIR: /tmp/fw-target
          ESP_IDF_VERSION: v5.3.2
          ESP_IDF_SDKCONFIG_DEFAULTS: ${{ matrix.sdkconfig }}
          # Dummy compile-time credentials — the wifi build embeds these via
          # env!(); CI only verifies that the code compiles.
          VIBE_SSID: ci-dummy-ssid
          VIBE_PASS: ci-dummy-pass
          VIBE_HOST: 127.0.0.1
          VIBE_PORT: "5151"
          VIBE_TOKEN: ci-dummy-token
        run: cargo build --release ${{ matrix.flags }}
      - name: Verify ELF output exists
        run: |
          ELF=/tmp/fw-target/xtensa-esp32-espidf/release/vibe-firmware
          if [ -f "$ELF" ]; then ls -lh "$ELF"; else echo "ERROR: ELF not found"; exit 1; fi
      # The pixel-art blob adds ~81 KB. The default build targets the built-in
      # single-`factory` layout (1 MiB app partition), so record the real
      # margin on every run and fail before an addition can silently overflow it.
      - name: Check app image fits the factory partition
        run: |
          # esp-idf-sys emits an ELF; a .bin only exists if espflash ran. Prefer
          # the .bin when present, else sum the flash-resident ELF sections.
          # NB the toolchain binary is `xtensa-esp-elf-size` (esp-15.x), NOT
          # `xtensa-esp32-elf-size` — the latter does not exist on the runner.
          BIN=$(find /tmp/fw-target/xtensa-esp32-espidf/release -maxdepth 1 -name '*.bin' | head -1)
          if [ -n "$BIN" ]; then
            SIZE=$(stat -c%s "$BIN")
          else
            ELF=/tmp/fw-target/xtensa-esp32-espidf/release/vibe-firmware
            SIZER=$(command -v xtensa-esp-elf-size || command -v xtensa-esp32-elf-size || true)
            if [ -z "$SIZER" ]; then
              echo "::warning::no esp size tool on PATH; falling back to ELF file size (overestimates)"
              SIZE=$(stat -c%s "$ELF")
            else
              SIZE=$("$SIZER" -A "$ELF" \
                     | awk '/^\.flash|^\.rodata|^\.text|^\.dram|^\.iram/ {s+=$2} END {print s+0}')
            fi
          fi
          if [ -z "$SIZE" ] || [ "$SIZE" -le 0 ]; then
            echo "::error::could not determine app image size"; exit 1
          fi
          # factory partition in the built-in single-app 4 MB layout
          LIMIT=$((1024 * 1024))
          MARGIN=$((LIMIT - SIZE))
          echo "app image: $SIZE bytes, limit: $LIMIT, margin: $MARGIN"
          {
            echo "### Firmware size (${{ matrix.name }})"
            echo ""
            echo "| metric | bytes |"
            echo "| --- | ---: |"
            echo "| app image | $SIZE |"
            echo "| factory partition | $LIMIT |"
            echo "| margin | $MARGIN |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE" -ge "$LIMIT" ]; then
            echo "::error::app image ($SIZE B) does not fit the factory partition ($LIMIT B)"
            exit 1
          fi
          if [ "$MARGIN" -lt 51200 ]; then
            echo "::warning::only $MARGIN bytes of factory-partition headroom remain (<50 KB)"
          fi

  # ── Firmware: BLE build (allow-failure — blocked on esp-idf-svc 0.51) ─────
  firmware-ble:
    name: Firmware · Build (ble, allow-failure)
    needs: changes
    if: needs.changes.outputs.firmware == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install esp Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32
          ldproxy: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ubuntu-latest-cargo-firmware-${{ hashFiles('firmware/Cargo.lock') }}
          restore-keys: |
            ubuntu-latest-cargo-firmware-
            ubuntu-latest-cargo-
      - name: Build firmware (ble)
        env:
          CARGO_TARGET_DIR: /tmp/fw-target
          ESP_IDF_VERSION: v5.3.2
          ESP_IDF_SDKCONFIG_DEFAULTS: "sdkconfig.defaults;sdkconfig.defaults.ble"
        run: cargo build --release --features ble

  # ── Aggregation gate — always runs, one required status for every PR ──────
  ci-gate:
    name: CI / all-green
    if: always()
    needs: [changes, bridge-test, bridge-lint, firmware-build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs passed
        run: |
          echo "bridge-test    = ${{ needs.bridge-test.result }}"
          echo "bridge-lint    = ${{ needs.bridge-lint.result }}"
          echo "firmware-build = ${{ needs.firmware-build.result }}"
          # A 'skipped' result means the area was untouched — that is a pass.
          # firmware-ble is allow-failure and excluded from the blocking set.
          for r in "${{ needs.bridge-test.result }}" "${{ needs.bridge-lint.result }}" "${{ needs.firmware-build.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required CI job did not pass ($r)."
              exit 1
            fi
          done
          echo "All required CI jobs passed (skipped = not applicable)."
