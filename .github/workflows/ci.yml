name: CI

# Single entry point for pull-request and integration CI. A change-detection
# job scopes the expensive builds (bridge / firmware) to what actually changed,
# and a final "CI / all-green" gate always runs — so every PR, even a docs-only
# one, reports one consistent status that branch protection can require without
# deadlocking on path-filtered checks.

on:
  push:
    branches: [master, main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Detect which areas changed ────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      bridge: ${{ steps.filter.outputs.bridge }}
      firmware: ${{ steps.filter.outputs.firmware }}
      tools: ${{ steps.filter.outputs.tools }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            bridge:
              - 'bridge/**'
              # The host test suite for firmware logic lives in bridge/tests/ but
              # reaches into the firmware crate: #[path]-includes mascot.rs /
              # proto.rs / sprite.rs and include_bytes!s the sprite blob. Without
              # these two lines a firmware-only PR (e.g. an artwork refresh)
              # skips all of them — including the golden-checksum test that is
              # the ONLY guard that the committed blob decodes as intended.
              - 'firmware/src/**'
              - 'firmware/assets/**'
              - '.github/workflows/ci.yml'
            firmware:
              - 'firmware/**'
              - '.github/workflows/ci.yml'
            tools:
              - 'tools/**'
              - 'assets/gif/**'
              - 'firmware/assets/**'
              - '.github/workflows/ci.yml'

  # ── Bridge: tests (Linux + Windows) ───────────────────────────────────────
  bridge-test:
    name: Bridge · Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.bridge == 'true' || github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libudev-dev (Linux — required by serialport)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-
      - name: Run tests (all features)
        run: cargo test --all-features

  # ── Bridge: clippy + rustfmt ──────────────────────────────────────────────
  bridge-lint:
    name: Bridge · Clippy + fmt
    needs: changes
    if: needs.changes.outputs.bridge == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install libudev-dev (Linux — required by serialport)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ubuntu-latest-cargo-lint-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ubuntu-latest-cargo-lint-
            ubuntu-latest-cargo-
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ── Bridge: test coverage (non-blocking report) ───────────────────────────
  bridge-coverage:
    name: Bridge · Coverage
    needs: changes
    if: needs.changes.outputs.bridge == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install libudev-dev (Linux — required by serialport)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ubuntu-latest-cargo-cov-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ubuntu-latest-cargo-cov-
            ubuntu-latest-cargo-
      # Best-effort report: a coverage hiccup must not paint the commit red, so
      # the fallible steps carry continue-on-error rather than the job (a
      # job-level flag still reports the check run itself as failed).
      - name: Generate coverage (lcov)
        id: cov
        continue-on-error: true
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - name: Print coverage summary
        if: steps.cov.outcome == 'success'
        continue-on-error: true
        run: cargo llvm-cov report --summary-only
      - name: Note coverage failure
        if: steps.cov.outcome != 'success'
        run: echo "::warning title=Coverage report skipped::cargo llvm-cov failed; this job is informational and does not block CI."
      - name: Upload to Codecov (tokenless, best-effort)
        if: steps.cov.outcome == 'success'
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
      - name: Upload lcov artifact
        if: steps.cov.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: bridge-coverage-lcov
          path: lcov.info

  # ── Tools: GIF -> sprite converter tests (Python) ─────────────────────────
  # Guards the MOODS <-> mascot::mood_index wire contract and the converter's
  # determinism. Cheap (~1 min) and needs only Pillow.
  tools-test:
    name: Tools · Python tests
    needs: changes
    if: needs.changes.outputs.tools == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Pillow
        run: python3 -m pip install --upgrade Pillow
      - name: Run converter tests
        run: python3 tools/test_gif2sprite.py

  # ── Firmware: ESP32 build matrix (blocking) ───────────────────────────────
  # Every shipped feature combination must compile. BLE is known-broken on the
  # current esp toolchain (see firmware/Cargo.toml) and runs as a separate
  # non-blocking job below so the breakage stays visible without blocking.
  firmware-build:
    name: Firmware · Build (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.firmware == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: usb
            flags: ""
          - name: wifi-ota
            flags: "--features wifi,ota"
            sdkconfig: "sdkconfig.defaults;sdkconfig.defaults.ota"
          - name: eink
            flags: "--features eink"
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install esp Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32
          ldproxy: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ubuntu-latest-cargo-firmware-${{ hashFiles('firmware/Cargo.lock') }}
          restore-keys: |
            ubuntu-latest-cargo-firmware-
            ubuntu-latest-cargo-
      # NB: these paths are deliberately RELATIVE, which means esp-idf-sys drops
      # the extra layer — so this job verifies that `--features wifi,ota`
      # COMPILES, not that the OTA partition table applies. Passing them
      # absolutely (the correct form) makes the layer land and then fails: IDF
      # resolves CONFIG_PARTITION_TABLE_CUSTOM_FILENAME against PROJECT_DIR,
      # which esp-idf-sys points at its own out/ dir, where partitions_ota.csv
      # does not exist. Tracked in #21 — fixing it is an OTA-flow change, not a
      # CI change. Do not "fix" this to absolute paths without #21.
      - name: Build firmware (${{ matrix.name }})
        env:
          CARGO_TARGET_DIR: /tmp/fw-target
          ESP_IDF_VERSION: v5.3.2
          ESP_IDF_SDKCONFIG_DEFAULTS: ${{ matrix.sdkconfig }}
          # Dummy compile-time credentials — the wifi build embeds these via
          # env!(); CI only verifies that the code compiles.
          VIBE_SSID: ci-dummy-ssid
          VIBE_PASS: ci-dummy-pass
          VIBE_HOST: 127.0.0.1
          VIBE_PORT: "5151"
          VIBE_TOKEN: ci-dummy-token
        run: cargo build --release ${{ matrix.flags }}
      - name: Verify ELF output exists
        run: |
          ELF=/tmp/fw-target/xtensa-esp32-espidf/release/vibe-firmware
          if [ -f "$ELF" ]; then ls -lh "$ELF"; else echo "ERROR: ELF not found"; exit 1; fi
      # The pixel-art blob adds ~81 KB. The default build targets the built-in
      # single-`factory` layout (1 MiB app partition), so record the real
      # margin on every run and fail before an addition can silently overflow it.
      - name: Check app image fits the factory partition
        run: |
          # Measure the flash-resident sections of the app ELF directly. A
          # stray `.bin` (e.g. a partition-table binary) is NOT used here: an
          # earlier version of this step preferred any `.bin` it found, which
          # silently measured the wrong file and reported a fake, identical
          # size across every matrix leg. The ELF at this path is reliable.
          # NB the toolchain binary is `xtensa-esp-elf-size` (esp-15.x), NOT
          # `xtensa-esp32-elf-size` — the latter does not exist on the runner.
          ELF=/tmp/fw-target/xtensa-esp32-espidf/release/vibe-firmware
          SIZER=$(command -v xtensa-esp-elf-size || command -v xtensa-esp32-elf-size || true)
          if [ -z "$SIZER" ]; then
            echo "::warning::no esp size tool on PATH; falling back to ELF file size (overestimates)"
            SIZE=$(stat -c%s "$ELF" 2>/dev/null || echo "")
          else
            SIZER_OUTPUT=$("$SIZER" -A "$ELF" 2>&1 || true)
            echo "----- $SIZER -A $ELF -----"
            echo "$SIZER_OUTPUT"
            echo "---------------------------------------------------------"
            {
              echo "<details><summary>Raw <code>$(basename "$SIZER") -A</code> output (${{ matrix.name }})</summary>"
              echo ""
              echo '```'
              echo "$SIZER_OUTPUT"
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
            # Sum every loaded section (nonzero address) that isn't a
            # zero-initialized RAM section (bss/noinit never occupies space
            # in the flashed image). This is deliberately not a hardcoded
            # list of esp-idf section-name prefixes — the raw table printed
            # above is what makes this arithmetic auditable, not a regex.
            SIZE=$(echo "$SIZER_OUTPUT" | awk '
              $1 ~ /^\./ && $2 ~ /^[0-9]+$/ {
                name = tolower($1); sz = $2 + 0; addr = $3 + 0
                if (name ~ /bss|noinit/) next
                if (addr == 0) next
                s += sz
              }
              END { print s+0 }
            ')
          fi
          if [ -z "$SIZE" ] || [ "$SIZE" -le 0 ]; then
            echo "::error::could not determine app image size"; exit 1
          fi
          # A real firmware image embedding the ~82 KB pixel-art asset cannot
          # be anywhere near this small. Landing here means the measurement
          # itself is broken (wrong file, wrong tool, wrong sections) — a
          # guard that can't detect its own misconfiguration is worthless,
          # so fail loudly instead of reporting a fictitious margin.
          PLAUSIBILITY_FLOOR_BYTES=204800
          if [ "$SIZE" -lt "$PLAUSIBILITY_FLOOR_BYTES" ]; then
            echo "::error::measured app image size ($SIZE B) is implausibly small (< $PLAUSIBILITY_FLOOR_BYTES B) — the size guard is measuring the wrong thing, not a genuinely tiny firmware"
            exit 1
          fi
          # Partition limit depends on which layout this matrix leg targets:
          # usb/eink keep the built-in single-`factory` layout (1 MiB app
          # partition); wifi-ota targets the dual-slot OTA layout defined in
          # firmware/partitions_ota.csv, whose `ota_0` slot is 0x1A0000 =
          # 1,703,936 B. This checks each build against its INTENDED layout;
          # whether the OTA sdkconfig layer is actually applied at build time
          # is tracked separately and is out of scope for this guard.
          case "${{ matrix.name }}" in
            wifi-ota)
              LIMIT=1703936
              LIMIT_DESC="ota_0 slot, partitions_ota.csv"
              ;;
            *)
              LIMIT=1048576
              LIMIT_DESC="factory partition"
              ;;
          esac
          MARGIN=$((LIMIT - SIZE))
          echo "app image: $SIZE bytes, limit: $LIMIT B ($LIMIT_DESC), margin: $MARGIN"
          {
            echo "### Firmware size (${{ matrix.name }})"
            echo ""
            echo "| metric | value |"
            echo "| --- | ---: |"
            echo "| app image | $SIZE B |"
            echo "| partition limit | $LIMIT B ($LIMIT_DESC) |"
            echo "| margin | $MARGIN B |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE" -ge "$LIMIT" ]; then
            echo "::error::app image ($SIZE B) does not fit the $LIMIT_DESC ($LIMIT B)"
            exit 1
          fi
          if [ "$MARGIN" -lt 51200 ]; then
            echo "::warning::only $MARGIN bytes of $LIMIT_DESC headroom remain (<50 KB)"
          fi
      # Makes the gap from #21 visible on every run instead of silently green:
      # this job proves the ota feature compiles, NOT that the OTA partition
      # table is in effect. Note the size guard above deliberately checks
      # wifi-ota against the ota_0 slot (its INTENDED layout); this step is what
      # records that the intended layout is not actually applied yet.
      - name: Report OTA partition-table coverage gap (#21)
        if: matrix.name == 'wifi-ota'
        run: |
          MERGED=$(find /tmp/fw-target -path '*esp-idf-sys-*/out/sdkconfig' | head -1)
          if [ -n "$MERGED" ] && grep -q '^CONFIG_PARTITION_TABLE_CUSTOM=y' "$MERGED"; then
            echo "::notice::OTA sdkconfig layer applied — #21 may be resolved; re-check this job."
          else
            echo "::warning title=OTA partition table not verified (#21)::sdkconfig.defaults.ota is dropped by esp-idf-sys (relative path), so this job only proves --features wifi,ota compiles. The OTA partition layout is NOT exercised."
          fi

  # ── Firmware: BLE build (non-blocking — blocked on esp-idf-svc 0.51) ──────
  # `continue-on-error` deliberately sits on the BUILD STEP, not on the job: at
  # job level GitHub still reports the check run itself as a failure, so master
  # showed a permanent red X for a breakage we knowingly accept. At step level
  # the job reports green and the breakage is surfaced as an annotation plus a
  # job summary instead.
  firmware-ble:
    name: Firmware · Build (ble, non-blocking)
    needs: changes
    if: needs.changes.outputs.firmware == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install esp Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32
          ldproxy: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ubuntu-latest-cargo-firmware-${{ hashFiles('firmware/Cargo.lock') }}
          restore-keys: |
            ubuntu-latest-cargo-firmware-
            ubuntu-latest-cargo-
      - name: Build firmware (ble)
        id: build
        continue-on-error: true
        env:
          CARGO_TARGET_DIR: /tmp/fw-target
          ESP_IDF_VERSION: v5.3.2
          # Absolute paths — esp-idf-sys silently drops relative entries, which
          # is why the NimBLE options never reached the IDF build and the
          # `esp_idf_sys::ble_*` bindings came up missing.
          ESP_IDF_SDKCONFIG_DEFAULTS: "${{ github.workspace }}/firmware/sdkconfig.defaults;${{ github.workspace }}/firmware/sdkconfig.defaults.ble"
        run: cargo build --release --features ble
      - name: Report BLE build status
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            echo "### ✅ BLE firmware built" >> "$GITHUB_STEP_SUMMARY"
            echo "The known BLE breakage is resolved — consider promoting this job to blocking." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=BLE build failing (known, non-blocking)::esp32-nimble 0.9 declares the removed #![feature(inline_const_pat)] and will not compile on the current esp toolchain. Tracked in firmware/Cargo.toml."
            {
              echo "### ⚠️ BLE firmware build failed (known, non-blocking)"
              echo ""
              echo "\`esp32-nimble\` 0.9 declares the removed \`#![feature(inline_const_pat)]\` (rustc \`E0557\`)"
              echo "and cannot compile on the current esp toolchain. Unblocking it needs"
              echo "\`esp32-nimble\` >= 0.11.1, which requires \`esp-idf-svc\` 0.51 — that bump previously"
              echo "regressed the default build with an embassy-executor \`__pender\` link error."
              echo "See the pin rationale in \`firmware/Cargo.toml\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── Aggregation gate — always runs, one required status for every PR ──────
  ci-gate:
    name: CI / all-green
    if: always()
    needs: [changes, bridge-test, bridge-lint, tools-test, firmware-build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs passed
        run: |
          echo "bridge-test    = ${{ needs.bridge-test.result }}"
          echo "bridge-lint    = ${{ needs.bridge-lint.result }}"
          echo "tools-test     = ${{ needs.tools-test.result }}"
          echo "firmware-build = ${{ needs.firmware-build.result }}"
          # A 'skipped' result means the area was untouched — that is a pass.
          # firmware-ble is allow-failure and excluded from the blocking set.
          for r in "${{ needs.bridge-test.result }}" "${{ needs.bridge-lint.result }}" "${{ needs.tools-test.result }}" "${{ needs.firmware-build.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required CI job did not pass ($r)."
              exit 1
            fi
          done
          echo "All required CI jobs passed (skipped = not applicable)."
